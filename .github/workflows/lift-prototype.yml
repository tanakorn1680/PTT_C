name: Lift game DLL to C (stage 1)

# ขั้นที่ 1: หาฟังก์ชัน + แปลงเป็น C แล้วรายงานจำนวน/ข้อผิดพลาด
# repo ต้องเป็น PRIVATE. ใส่ไฟล์ .dll ไว้ใน game/ (ชื่ออะไรก็ได้ เช่น engine.dll)
# ถ้ามีหลายไฟล์ จะเลือกไฟล์ .dll ที่ใหญ่ที่สุด (เหมือน workflow ของ SCRE-AT ที่เลือก .so ใหญ่สุด)
# ไม่อัปโหลดโค้ดที่ได้จากตัวเกม: ส่งออกแค่สถิติกับ log

on:
  workflow_dispatch:
    inputs:
      reanalyze:
        description: "วิเคราะห์ใหม่ทั้งหมด (ไม่ใช้ cache ของ catalog)"
        type: boolean
        default: false
      dedupe:
        description: "ตัดจุดเข้ากลางฟังก์ชันที่ซ้ำ (แก้ไฟล์ C ยักษ์ 87MB) ดู work/dedupe_report.txt"
        type: boolean
        default: true
      fullbuild:
        description: "compile C ทั้งหมดเป็น ARM64 + ลอง ThinLTO link เพื่อวัดเวลา/RAM จริง (ช้า ~15-60 นาที)"
        type: boolean
        default: false
      fullbuild_mode:
        description: "lto (เหมือน nfsu2) หรือ nolto"
        type: string
        default: "lto"
      bench:
        description: "วัดเวลา/RAM การ compile ARM64 จากไฟล์ตัวอย่าง (ไม่เก็บโค้ดเกม; ไฟล์ใหญ่สุดใช้ ~9 นาที/8GB)"
        type: boolean
        default: false
      bench_files:
        description: "จำนวนไฟล์ตัวอย่างที่ใช้วัด"
        type: string
        default: "6"

jobs:
  lift:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PCRECOMP: ${{ github.workspace }}/pcrecomp
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout NFSU2 recompiled (patches + lift driver)
        uses: actions/checkout@v4
        with:
          repository: codepdbh/nfsu2-recompiled
          ref: c27896e3dad62593ffc0a0500ebb39dca42ad2e0
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install capstone pefile unicorn keystone-engine

      - name: Get pcrecomp 35548b8 and apply patches
        run: |
          git clone https://github.com/sp00nznet/pcrecomp.git pcrecomp
          cd pcrecomp
          git checkout 35548b8
          git config user.email ci@example.com
          git config user.name ci
          git am ../upstream/patches/pcrecomp/*.patch

      - name: Apply PTT lifter extension (fcomi family, lock xadd/cmpxchg/cmpxchg8b)
        run: python patches/ptt_lifter_ext.py pcrecomp

      - name: difftest of the lifter against Unicorn (informational)
        continue-on-error: true
        run: |
          mkdir -p work /tmp/lmwrap
          for cc in gcc cc clang; do
            real=$(command -v $cc || true); [ -n "$real" ] || continue
            printf '#!/bin/sh\nexec %s "$@" -lm\n' "$real" > /tmp/lmwrap/$cc; chmod +x /tmp/lmwrap/$cc
          done
          export PATH=/tmp/lmwrap:$PATH
          cd pcrecomp
          { python tools/lift/difftest.py --help 2>&1 | head -n 30; echo ------; \
            timeout 900 python tools/lift/difftest.py 2>&1 | tail -n 80; } > ../work/difftest.log || true
          tail -n 40 ../work/difftest.log

      - name: Find the DLL (any name, largest in game/)
        run: |
          DLLPATH=$(find game -type f -iname '*.dll' -printf '%s %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)
          if [ -z "$DLLPATH" ]; then
            echo "::error::ไม่พบไฟล์ .dll ใน game/ (ใส่ เช่น game/engine.dll)"
            exit 1
          fi
          echo ">> จะวิเคราะห์: $DLLPATH"
          find game -type f -iname '*.dll' -printf '%s %p\n' | sort -rn
          echo "DLL=$GITHUB_WORKSPACE/$DLLPATH" >> "$GITHUB_ENV"
          sha256sum "$DLLPATH"
          mkdir -p work

      - name: Restore catalog cache
        id: cache
        if: ${{ !inputs.reanalyze }}
        uses: actions/cache@v4
        with:
          path: |
            work/catalog.json
            work/seeds_all.json
          key: catalog-v1-${{ hashFiles('game/**') }}

      - name: Prepare lift driver (no NFSU2-specific config)
        run: |
          mkdir -p lift/scripts lift/config
          cp upstream/scripts/run_lift.py lift/scripts/
          : > lift/config/overrides.txt
          : > lift/config/exclude.txt
          : > lift/config/hooks.txt

      - name: Scan vtables and RTTI, merge seeds
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python pcrecomp/tools/cpp/vtable_scan.py "$DLL" --seeds work/vtable_seeds.json
          python pcrecomp/tools/cpp/rtti.py "$DLL" --seeds work/rtti_seeds.json
          python scripts/make_seeds.py "$DLL" work/seeds_all.json work/vtable_seeds.json work/rtti_seeds.json

      - name: Catalog functions (~10 min)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python lift/scripts/run_lift.py catalog "$DLL" work/seeds_all.json work/catalog.json > work/catalog.log 2>&1 \
            || { tail -n 60 work/catalog.log; exit 1; }
          grep -v "Disassembling function" work/catalog.log | tail -n 20

      - name: Dedupe catalog (drop mid-function duplicate entries)
        run: |
          if [ "${{ inputs.dedupe }}" = "true" ]; then
            python scripts/dedupe_catalog.py work/catalog.json work/catalog_lift.json work/dedupe_report.txt
          else
            cp work/catalog.json work/catalog_lift.json; echo "dedupe off" > work/dedupe_report.txt
          fi

      - name: Lift to C (~4 min)
        run: |
          python lift/scripts/run_lift.py lift "$DLL" work/catalog_lift.json work/gen > work/lift.log 2>&1 \
            || { tail -n 60 work/lift.log; exit 1; }
          tail -n 30 work/lift.log

      - name: Diagnostics for fcomi/lock support (lifter source excerpt + unimplemented forms)
        if: always()
        run: |
          python scripts/lift_diagnostics.py pcrecomp/tools/lift/lift32.py work/gen work || true

      - name: Compile-check the new emitted C (syntax only)
        continue-on-error: true
        run: bash scripts/compile_check.sh work/gen pcrecomp host/arm64_guest.h work/compile_check.txt

      - name: Full ARM64 compile + link (measure real build cost)
        if: ${{ inputs.fullbuild }}
        continue-on-error: true
        timeout-minutes: 200
        run: |
          bash scripts/full_compile.sh work/gen pcrecomp host/arm64_guest.h work/fb work/fullbuild.txt "${{ inputs.fullbuild_mode }}"

      - name: Measure ARM64 compile cost on a sample of the generated C
        if: ${{ inputs.bench }}
        continue-on-error: true
        run: |
          bash scripts/bench_compile.sh work/gen pcrecomp host/arm64_guest.h "${{ inputs.bench_files }}" work/bench.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Lift result"
            echo '```'
            tail -n 40 work/lift.log 2>/dev/null || tail -n 40 work/catalog.log
            echo '```'
            du -sh work/gen 2>/dev/null | sed 's/^/generated C size: /'
            if [ -f work/bench.txt ]; then echo "### Compile benchmark"; echo '```'; cat work/bench.txt; echo '```'; fi
            if [ -f work/fullbuild.txt ]; then echo "### Full build"; echo '```'; cat work/fullbuild.txt; echo '```'; fi
            if [ -f work/dedupe_report.txt ]; then echo "### Dedupe"; echo '```'; head -n 40 work/dedupe_report.txt; echo '```'; fi
            if [ -f work/compile_check.txt ]; then echo "### Compile check"; echo '```'; cat work/compile_check.txt; echo '```'; fi
            if [ -f work/difftest.log ]; then echo "### difftest (tail)"; echo '```'; tail -n 15 work/difftest.log; echo '```'; fi
            if [ -f work/big_functions.txt ]; then echo "### Largest files/functions"; echo '```'; head -n 30 work/big_functions.txt; echo '```'; fi
            if [ -f work/unimpl_forms.txt ]; then echo "### Unimplemented forms (top 25)"; echo '```'; head -n 27 work/unimpl_forms.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stats and logs (no game-derived code)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lift-report
          retention-days: 14
          path: |
            work/catalog.log
            work/lift.log
            work/gen/lift_stats.json
            work/bench.txt
            work/unimpl_forms.txt
            work/lifter_excerpt.txt
            work/big_functions.txt
            work/dedupe_report.txt
            work/fullbuild.txt
            work/compile_check.txt
            work/difftest.log
